<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Artha</title><link rel="stylesheet" href="/app.css"><script src="/login.js" defer></script></head>
<body><main style="max-width:460px;margin:8vh auto;padding:24px"><a href="/" class="brand">artha<span>↗</span></a><section class="panel" style="margin-top:32px;padding:28px"><h1 id="title">Welcome back.</h1><p class="muted" id="intro">Sign in to your private investment space.</p><form id="auth-form"><div class="form-grid"><label class="field wide hidden" id="name-field" hidden>Your name<input name="name" autocomplete="name" maxlength="100"></label><label class="field wide">Email address<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label class="field wide">Password<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label></div><p id="message" role="status" class="muted"></p><div class="form-actions"><button class="btn primary" id="submit" type="submit">Sign in</button></div></form><div class="divider"></div><button id="toggle" class="btn" type="button">Create an account</button><p class="tooltip-note">Your records stay in your account. Use a unique password of at least 12 characters.</p></section></main></body></html>
